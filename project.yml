name: ZeeChat
options:
  bundleIdPrefix: com.rishizamvar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "373D7DZ9NM"
    CODE_SIGN_STYLE: Automatic

targets:
  ZeeChat:
    type: application
    platform: iOS
    sources:
      - path: ZeeChat
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.zeechat
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  ZeeChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZeeChatTests
        excludes:
          - "**/.DS_Store"
          - "**/__Snapshots__/**"
    dependencies:
      - target: ZeeChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishizamvar.zeechat.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZeeChat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZeeChat"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: ZeeChat/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: ZeeChat
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # Background refresh — wakes the app every ~15min so notifications
        # fire even when the user hasn't opened it in a while.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.rishizamvar.zeechat.refresh

schemes:
  ZeeChat:
    build:
      targets:
        ZeeChat: all
        ZeeChatTests: [test]
    run:
      config: Debug
    test:
      targets:
        - ZeeChatTests
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
